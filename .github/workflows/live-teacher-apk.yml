name: Compiler l'APK Live Teacher (test)

on:
  push:
    branches: [feature/live-teacher-pilote]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Générer la partie Android
        run: |
          flutter create --platforms=android --org com.kounadia --project-name barro_learn .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="barro_learn"/android:label="BARRO Live"/' "$MANIFEST"
          sed -i 's/applicationId = "com.kounadia.barro_learn"/applicationId = "com.kounadia.barro_learn.live"/' android/app/build.gradle.kts
          grep -q 'barro_learn.live' android/app/build.gradle.kts || { echo "applicationId non modifié : arrêt."; exit 1; }
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          fi

      - name: Préparer la signature
        env:
          KEYSTORE_B64: ${{ secrets.BARRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Secret BARRO_KEYSTORE_BASE64 absent : arrêt."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/barro-release.p12
          GRADLE=android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("debug")' "$GRADLE" || { echo "Modèle Gradle inattendu : arrêt."; exit 1; }
          grep -q '^    buildTypes {' "$GRADLE" || { echo "Bloc buildTypes introuvable : arrêt."; exit 1; }
          cat > "$RUNNER_TEMP/signing.kts" <<'KTS'
              signingConfigs {
                  create("release") {
                      storeFile = file("barro-release.p12")
                      storeType = "pkcs12"
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "barro"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          KTS
          sed -i "/^    buildTypes {/e cat $RUNNER_TEMP/signing.kts" "$GRADLE"
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$GRADLE"
          grep -q 'create("release")' "$GRADLE" && grep -q 'getByName("release")' "$GRADLE" || { echo "Signature non configurée : arrêt."; exit 1; }

      - name: Télécharger les paquets
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Lancer les tests
        run: flutter test

      - name: Compiler une APK légère par type de téléphone
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BARRO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Secret BARRO_KEYSTORE_PASSWORD absent : arrêt."; exit 1; fi
          flutter build apk -t lib/main_live_teacher.dart --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Afficher la taille des APK
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Vérifier la signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          N=0
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee -a signature.txt
            N=$((N + 1))
          done
          test "$(grep -c 'certificate SHA-256 digest: 35728cbc77d14fe13d683d6194a0bd613eefc8a39179ff0f8fbe63d6e721e8b2' signature.txt)" -eq "$N" || { echo "Une APK n'est pas signée avec la clé BARRO : arrêt."; exit 1; }
          echo "Les $N APK sont signées avec la clé BARRO."

      - name: APK pour la plupart des téléphones (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: live-teacher-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: APK pour les anciens téléphones (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: live-teacher-ancien-telephone
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
